<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title · Parker Tse</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="pygments.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer
    onload="document.querySelectorAll('.math').forEach(function (el) { renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }, { left: '\\[', right: '\\]', display: true }] }); })"></script>
</head>
<body>
  <main class="container">
    <nav class="crumbs">
      <a href="/">Parker Tse</a> / <a href="./">Editorials</a>
    </nav>

    <article class="post">
      <h1>$title</h1>
      <p class="post-meta">$badge$tags<time>$date</time></p>
      <p class="links">$link</p>

      $body
    </article>

    <footer>
      <span>&copy; $year Parker Tse</span>
    </footer>
  </main>
</body>
</html>
