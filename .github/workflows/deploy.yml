name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build editorials
        run: |
          pip install -r requirements.txt
          python build.py
      - name: Assemble site
        run: |
          rsync -a ./ _deploy/ \
            --exclude .git --exclude .github --exclude .gitignore --exclude _deploy \
            --exclude _editorials --exclude templates --exclude __pycache__ \
            --exclude build.py --exclude requirements.txt
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _deploy
